name: Build wheels and publish release assets

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-release-tag:
    name: Resolve latest release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags
          tag="$(git tag --sort=-v:refname | head -n 1)"

          if [ -z "$tag" ]; then
            echo "Nenhuma tag foi encontrada. Crie uma tag antes de publicar os assets da release." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $tag"

  build-wheels:
    name: Build ${{ matrix.label }} wheels
    needs: resolve-release-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            cibw_archs: x86_64
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            cibw_archs: aarch64
          - label: windows-amd64
            os: windows-latest
            cibw_archs: AMD64
          - label: windows-arm64
            os: windows-11-arm
            cibw_archs: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup default stable
          rustc --version
          cargo --version

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          ROSU_PP_PY_FORCE_BUILD: "1"
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_* *-win32 *-manylinux_i686"
          CIBW_TEST_COMMAND: "python -c \"import rosu_pp_py\""
          CIBW_ARCHS_LINUX: ${{ matrix.cibw_archs }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.cibw_archs }}
          CIBW_BEFORE_ALL_LINUX: >-
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain stable
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.label }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release assets
    needs:
      - resolve-release-tag
      - build-wheels
    runs-on: ubuntu-latest

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: release-wheels
          merge-multiple: true

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.resolve-release-tag.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(release-wheels/*.whl)

          if [ ${#wheels[@]} -eq 0 ]; then
            echo "Nenhuma wheel foi encontrada para publicar." >&2
            exit 1
          fi

          ls -lh release-wheels

          if gh release view "$TAG_NAME" --repo "$REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              gh release delete-asset "$TAG_NAME" "$asset" --repo "$REPOSITORY" --yes
            done < <(gh release view "$TAG_NAME" --repo "$REPOSITORY" --json assets --jq '.assets[].name | select(endswith(".whl.zip"))')

            gh release upload "$TAG_NAME" "${wheels[@]}" --repo "$REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" "${wheels[@]}" --repo "$REPOSITORY" --verify-tag --generate-notes
          fi
